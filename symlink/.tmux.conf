# ==============================================================================
# Ben Diuguid's .tmux.conf (tmux 3.2+)
# ==============================================================================

# remap prefix from 'C-b' to 'C-a'
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# ------------------------------------------------------------------------------
# Keybindings
# ------------------------------------------------------------------------------
# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# switch panes using Alt-arrow without prefix
# M-key === Meta-key === alt-key
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ------------------------------------------------------------------------------
# Behavior
# ------------------------------------------------------------------------------
# Enable mouse mode
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# Terminal & colors (screen-256color has terminfo everywhere, incl. macOS);
# advertise truecolor support for modern terminals (Ghostty, iTerm2, etc.)
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"

# ------------------------------------------------------------------------------
# Design
# ------------------------------------------------------------------------------
# Modes (copy mode, clock)
setw -g clock-mode-colour colour135
setw -g mode-style "fg=colour196,bg=colour238,bold"

# Panes
set -g pane-border-style "fg=colour238,bg=colour235"
set -g pane-active-border-style "fg=colour51,bg=colour236"

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-style "fg=colour137,bg=colour234,dim"
set -g status-left ''
set -g status-left-length 20
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# Window status
setw -g window-status-style "fg=colour138,bg=colour235,none"
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-current-style "fg=colour81,bg=colour238,bold"
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-bell-style "fg=colour255,bg=colour1,bold"

# Messages
set -g message-style "fg=colour232,bg=colour166,bold"
set -g message-command-style "fg=blue,bg=black"
